version: "3.9"
services:
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/handitwiki
      BITBUCKET_BASE_URL: ${BITBUCKET_BASE_URL:https://api.bitbucket.org/2.0}
      GIT_PROVIDER: ${GIT_PROVIDER:-bitbucket}
      BITBUCKET_WORKSPACE: ${BITBUCKET_WORKSPACE}
      BITBUCKET_REPO: ${BITBUCKET_REPO}
      BITBUCKET_BRANCH: ${BITBUCKET_BRANCH:-main}
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN}
      REPOSITORY_RAW_BASE_URL: ${REPOSITORY_RAW_BASE_URL:-}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-Handit Wiki}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-handit-wiki@local}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PORT: 5174
    ports:
      - "5174:5174"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
volumes:
  mongo-data:
